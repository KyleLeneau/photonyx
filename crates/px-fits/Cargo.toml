[package]
name = "px-fits"
version = "0.2.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Read-only memory-mapped byte source (`source::MmapSource`). Off by default:
# it is only sound while the mapped file is not truncated/rewritten, which is
# hard to guarantee for frames on removable or network volumes. See D1 / the
# benchmark report in README.md.
mmap = ["dep:memmap2"]

[dependencies]
px-fs = { workspace = true}

chrono = { workspace = true }
flate2 = { workspace = true }
memmap2 = { workspace = true, optional = true }
rayon = { workspace = true }
regex = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
rustafits = { git = "https://github.com/KyleLeneau/rustafits", branch = "jpg-feature"}

[dev-dependencies]
criterion = { workspace = true }
dhat = { workspace = true }
proptest = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "header_scan"
harness = false

[[bench]]
name = "full_frame"
harness = false

[[bench]]
name = "region"
harness = false

[[bench]]
name = "write"
harness = false

[[bench]]
name = "compressed"
harness = false

[lints]
workspace = true
